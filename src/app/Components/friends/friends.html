<section class="card" id="amis">
  <div class="icon">👥</div>
  <div>
    <h2>Liste des amis</h2>
    
<div class="input">
    @for (item of friendsList; track item) {
       <input type="text" [(ngModel)]="item.name" />
    }
</div>
   <ul>
    @for (item of friendsList; track item) {
        <li>{{ item.name }}</li>
    }
</ul>
  </div>
</section>
